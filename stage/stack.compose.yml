# GENERATED by tools/package.py. Overlay for a `wam install-local` developer proof:
#   docker compose -p <project> -f <stage>/compose.yml -f <stage>/source/stage/stack.compose.yml up -d
services:
  translator:
    environment:
      ENGINE_URL: http://translator-engine:5000
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request;urllib.request.urlopen('http://127.0.0.1:8799/healthz',timeout=3)
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  translator-engine:
    image: libretranslate/libretranslate:v1.9.6@sha256:1de2d7056bb8ad607a412f4563d9abe324ff632b43b5be9428bcc8e213aebb32
    user: 1000:1000
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    tmpfs:
    - /tmp
    - /app/db:uid=1000,gid=1000
    restart: unless-stopped
    mem_limit: 2g
    environment:
      HOME: /models
      LT_LOAD_ONLY: en,th,ja,zh,ko,vi,es,fr,de,ru
      LT_UPDATE_MODELS: 'false'
      LT_THREADS: '1'
      LT_CHAR_LIMIT: '5000'
      LT_DISABLE_WEB_UI: 'true'
      LT_DISABLE_FILES_TRANSLATION: 'true'
      LT_METRICS: 'false'
    volumes:
    - type: volume
      source: app-data
      target: /models
      volume:
        subpath: models
    healthcheck:
      test:
      - CMD
      - /app/venv/bin/python
      - /app/scripts/healthcheck.py
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30m
    depends_on:
      translator:
        condition: service_healthy
